name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out LTTS modules
        uses: actions/checkout@v4
        with:
          repository: seruva19/LTTS-modules
          path: LTTS-modules
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      # requirements.txt pins the plain CPU wheels; requirements-cuda.txt is the
      # opt-in GPU path and is deliberately not installed here.
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Tests
        env:
          LTTS_SKIP_MODULE_VENVS: '1'
          LTTS_MODULES_DIR: LTTS-modules
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx vitest run
      - run: npm run build-client
